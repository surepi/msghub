# MsgHub 留言汇 —— Docker 部署
#
#   1. cp .env.example .env   并设置 ADMIN_PASSWORD 和 MySQL 凭据
#   2. 按 docs/SECURITY-DEPLOYMENT.md 准备数据目录并执行迁移，再启动服务
#   3. 打开 http://127.0.0.1:20100
#
# 业务数据保存在共享 MariaDB；上传文件与签名密钥保存在 ./data。
# 网站需要能访问到提交接口，公网使用请放在 HTTPS 反向代理后面。

services:
  msghub:
    build: .
    image: msghub:latest
    container_name: msghub
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    pids_limit: 128
    tmpfs:
      - /tmp:size=64m,mode=1777
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${HOST_PORT:-20100}:20100"
    volumes:
      - ./data:/data
    networks:
      - mariadb-shared
    environment:
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?请先 cp .env.example .env 并设置 ADMIN_PASSWORD}
      DB_BACKEND: mysql
      DB_INIT_SCHEMA: "0"
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: ${DB_NAME:-msghub}
      DB_USER: ${DB_USER:-msghub}
      DB_PASSWORD: ${DB_PASSWORD:?请在 .env 中设置 DB_PASSWORD}
      SECRET_KEY:
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-127.0.0.1}
      RATE_LIMIT_PER_MIN: ${RATE_LIMIT_PER_MIN:-5}
      AI_CALLS_PER_HOUR: ${AI_CALLS_PER_HOUR:-120}
      # QQ 官方机器人（q.qq.com → 开发设置）。不填则只能在网页后台回复
      QQ_APP_ID: ${QQ_APP_ID:-}
      QQ_APP_SECRET: ${QQ_APP_SECRET:-}
      QQ_CALLBACK_KEY: ${QQ_CALLBACK_KEY:-}
      QQ_CALLBACK_MAX_AGE: ${QQ_CALLBACK_MAX_AGE:-300}
      TZ: ${TZ:-Asia/Shanghai}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  mariadb-shared:
    external: true
    name: mariadb-shared
