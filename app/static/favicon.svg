  <!-- Top-Right Arc -->
  <path d="M 256 128 C 326.7 128 384 185.3 384 256"
        stroke="#FFFFFF" stroke-width="28" stroke-linecap="round"/>

  <!-- Left Inner Arc -->
  <path d="M 172 256 C 172 209.6 209.6 172 256 172"
        stroke="#FFFFFF" stroke-width="24" stroke-linecap="round"/>

  <!-- Bottom-Left Inner Wave -->
  <path d="M 180 300 C 196 325 224 340 256 340 C 285 340 310 327 326 306"
        stroke="#FFFFFF" stroke-width="22" stroke-linecap="round"/>

  <!-- Central Convergence Core Accent (Coral Orange Hub) -->
