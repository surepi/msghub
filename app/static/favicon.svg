  </defs>

  <!-- Outer Speech Hub Bubble -->
  <path d="M 256 64 C 150 64 64 150 64 256 C 64 298 77 337 100 369 L 76 436 C 72 447 83 457 94 453 L 165 426 C 193 440 224 448 256 448 C 362 448 448 362 448 256 C 448 150 362 64 256 64 Z"
        fill="url(#hubGrad)"/>

